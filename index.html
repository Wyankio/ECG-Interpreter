const stages=['Irama','Frekuensi','Gelombang P','PR / AV block','QRS','Axis','Q patologis','Lebar QRS','Transition / BBB','LVH / RVH','Aritmia'];
let idx=0,stage=0;
function caseLabels(c){return ['STEMI','NSTEMI','OMI','UA','VF_VT','Paced','AMI'].filter(k=>c[k]===1)}
function render(){let c=cases[idx];caseTitle.textContent=c.ecg_med_record;caseMeta.textContent=`Patient ${c.Patient_id} · ${c.age??'—'} th`;record.innerHTML=`Record: ${c.ecg_med_record}<br>Age: ${c.age??'—'}<br>Sex code: ${c.gender??'—'}<br>Time interval: ${c.Time_Interval??'—'}`;steps.innerHTML=stages.map((s,i)=>`<span class="step ${i===stage?'active':''}">${i+1}. ${s}</span>`).join('');question.innerHTML=`<h2>${stages[stage]}</h2><p>Amati waveform terlebih dahulu. Pilih temuan yang menurutmu paling sesuai sebelum membuka data label.</p><button onclick="reveal()">Buka petunjuk</button><div id="result"></div>`;drawAll(c)}
function reveal(){let c=cases[idx];let text=['Mulai dari P wave, hubungan P-QRS, dan keteraturan R-R.','Hitung RR dari waveform. Sampling rate median ini 500 Hz.','Fokus lead II dan V1. Nilai durasi, amplitudo, dan komponen bipasik.','Ukur dari awal P sampai awal QRS bila P dan QRS dapat diidentifikasi.','Nilai morfologi dan durasi kompleks QRS di seluruh lead.','Gunakan I dan aVF sebagai kuadran awal.','Nilai Q pada lead yang relevan dan kontigu.','Bandingkan durasi QRS dengan 120 ms.','Nilai progresi R V1–V6 dan pola RBBB/LBBB.','Gunakan kriteria voltage bersama morfologi pendukung.','Cari prematuritas, keteraturan, P wave, lebar QRS, dan hubungan atrium-ventrikel.'][stage];result.innerHTML=`<div class="result"><strong>Petunjuk:</strong> ${text}<br><br><button onclick="next()">Lanjut →</button></div>`}

let baseline=0,scale=1;
async function drawAll(c){let path='../data/med/'+c.ecg_med_record;let buf=await fetch(path).then(r=>r.arrayBuffer());let a=new Int16Array(buf);let matrix=Array.from({length:12},()=>[]);for(let i=0;i<a.length;i++)matrix[i%12].push(a[i]);let all=a.length?Array.from(a):[0];let med=all.reduce((s,v)=>s+v,0)/all.length;baseline=med;let max=Math.max(...all.map(v=>Math.abs(v-med)));scale=(h=86)*.38/max;ecg.innerHTML='';leads.forEach((l,i)=>{let d=document.createElement('div');d.className='lead';d.innerHTML=`<label>${l}</label><canvas></canvas>`;ecg.append(d);draw(d.querySelector('canvas'),matrix[i])})}
